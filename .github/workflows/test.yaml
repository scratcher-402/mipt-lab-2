name: Run tests
on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:

        - name: Get code
          uses: actions/checkout@v4

        - name: Install build tools
          run: sudo apt install build-essential -y

        - name: Build
          run: make

        - name: Run
          run: ./lab2 < test_input.txt

        
